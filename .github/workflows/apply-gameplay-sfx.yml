name: Apply gameplay SFX

on:
  push:
    branches:
      - feature/creative-audio-art-polish

permissions:
  contents: write

concurrency:
  group: apply-gameplay-sfx
  cancel-in-progress: true

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/creative-audio-art-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-vite/package-lock.json
      - name: Apply guarded engine patch
        run: python scripts/patch_gameplay_sfx.py
      - name: Install frontend dependencies
        working-directory: react-vite
        run: npm ci --no-audit --no-fund
      - name: Run Jest
        working-directory: react-vite
        run: npm test
      - name: Lint
        working-directory: react-vite
        run: npm run lint
      - name: Production build
        working-directory: react-vite
        run: npm run build
      - name: Remove one-shot integration files
        run: |
          rm scripts/patch_gameplay_sfx.py
          rm .github/workflows/apply-gameplay-sfx.yml
      - name: Commit validated gameplay audio integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-vite/src/components/Game/engine.js scripts/patch_gameplay_sfx.py .github/workflows/apply-gameplay-sfx.yml
          git diff --cached --quiet && exit 0
          git commit -m "Wire production gameplay feedback sounds"
          git push origin HEAD:feature/creative-audio-art-polish
