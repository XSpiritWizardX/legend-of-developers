name: Apply Willowbrook Hollow interior

on:
  push:
    branches:
      - feature/willowbrook-small-interior

permissions:
  contents: write

concurrency:
  group: apply-willowbrook-small-interior
  cancel-in-progress: true

jobs:
  integrate-interior:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/willowbrook-small-interior
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-vite/package-lock.json
      - name: Apply guarded world and engine patch
        run: python scripts/patch_willowbrook_small_interior.py
      - name: Install frontend dependencies
        working-directory: react-vite
        run: npm ci
      - name: Run Jest
        working-directory: react-vite
        run: npm test
      - name: Lint
        working-directory: react-vite
        run: npm run lint
      - name: Production build
        working-directory: react-vite
        run: npm run build
      - name: Commit validated small interior
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-vite/src/components/Game/world.js react-vite/src/components/Game/engine.js
          git rm scripts/patch_willowbrook_small_interior.py .github/workflows/apply-willowbrook-small-interior.yml
          git diff --cached --check
          git commit -m "Add centered Willowbrook Hollow small interior"
          git push origin HEAD:feature/willowbrook-small-interior
