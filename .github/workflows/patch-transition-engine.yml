name: Patch transition engine

on:
  push:
    branches: [fix/safe-room-transitions]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[transition-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/safe-room-transitions
      - name: Patch legacy transition path
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('react-vite/src/components/Game/engine.js')
          source = path.read_text()

          import_anchor = '''import {
            resolveRoomRuntime, roomChanged, settleCamera, smoothCamera,
          } from "./roomRuntime";
          '''
          transition_import = '''import {
            boundaryProbe, firstSafeTransitionLanding, transitionDirection,
          } from "./roomTransitionSafety";
          '''
          if transition_import not in source:
              if import_anchor not in source:
                  raise SystemExit('roomRuntime import anchor not found')
              source = source.replace(import_anchor, import_anchor + transition_import, 1)

          old = '''    if (toX !== camera.x || toY !== camera.y) {
            if (toX - camera.x >= VIEW_W - 1) player.x = toX + 32;
            if (camera.x - toX >= VIEW_W - 1) player.x = toX + VIEW_W - 32;
            if (toY - camera.y >= VIEW_H - 1) player.y = toY + 32;
            if (camera.y - toY >= VIEW_H - 1) player.y = toY + VIEW_H - 32;
            screenTransition = {
              fromX: camera.x,
              fromY: camera.y,
              toX,
              toY,
              elapsed: 0,
              duration: 0.42,
            };
            playGameSfx(GAME_SFX.ROOM);
            save();
          }
          '''
          new = '''    if (toX !== camera.x || toY !== camera.y) {
            const direction = transitionDirection(camera.x, camera.y, toX, toY, VIEW_W, VIEW_H);
            const probe = boundaryProbe({
              direction,
              cameraX: camera.x,
              cameraY: camera.y,
              viewWidth: VIEW_W,
              viewHeight: VIEW_H,
              playerX: player.x,
              playerY: player.y,
            });
            // Direction metadata says a neighboring room exists, but the player's
            // exact crossing point must also be a real opening in the authored perimeter.
            if (solidAt(probe.x, probe.y)) return;

            const landing = firstSafeTransitionLanding({
              direction,
              toX,
              toY,
              playerX: player.x,
              playerY: player.y,
              tileSize: TILE,
              viewWidth: VIEW_W,
              viewHeight: VIEW_H,
            }, (x, y) => canMove(x, y));
            // Never begin a camera handoff unless the destination has a collision-safe
            // landing. This prevents a save or transition from embedding the player.
            if (!landing) return;

            player.x = landing.x;
            player.y = landing.y;
            traversal = null;
            safeGroundHistory = [{ x: player.x, y: player.y }];
            lastSafeTile = { x: player.x, y: player.y };
            screenTransition = {
              fromX: camera.x,
              fromY: camera.y,
              toX,
              toY,
              elapsed: 0,
              duration: 0.42,
            };
            playGameSfx(GAME_SFX.ROOM);
            save();
          }
          '''
          if new not in source:
              if old not in source:
                  raise SystemExit('legacy transition block not found')
              source = source.replace(old, new, 1)

          path.write_text(source)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-vite/src/components/Game/engine.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: validate room transition landings [transition-patched]"
          git push origin HEAD:fix/safe-room-transitions
