name: Apply adaptive music

on:
  push:
    branches:
      - feature/adaptive-ambient-music

permissions:
  contents: write

concurrency:
  group: apply-adaptive-music
  cancel-in-progress: true

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/adaptive-ambient-music
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: react-vite/package-lock.json
      - name: Apply guarded engine patch
        run: python scripts/patch_adaptive_music.py
      - name: Install frontend dependencies
        working-directory: react-vite
        run: npm ci --no-audit --no-fund
      - name: Run Jest
        working-directory: react-vite
        run: npm test -- --runInBand
      - name: Lint
        working-directory: react-vite
        run: npm run lint
      - name: Production build
        working-directory: react-vite
        run: npm run build
      - name: Remove one-shot integration files
        run: |
          rm scripts/patch_adaptive_music.py
          rm .github/workflows/apply-adaptive-music.yml
      - name: Commit validated music integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-vite/src/components/Game/engine.js scripts/patch_adaptive_music.py .github/workflows/apply-adaptive-music.yml
          git diff --cached --quiet && exit 0
          git commit -m "Integrate adaptive ambient music"
          git push origin HEAD:feature/adaptive-ambient-music
