name: Apply action feel polish

on:
  push:
    branches:
      - feature/action-feel-polish

permissions:
  contents: write

concurrency:
  group: apply-action-feel-polish
  cancel-in-progress: true

jobs:
  integrate-action-feel:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/action-feel-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-vite/package-lock.json
      - name: Apply guarded engine patch
        run: python scripts/patch_action_feel.py
      - name: Install frontend dependencies
        working-directory: react-vite
        run: npm ci
      - name: Run Jest
        working-directory: react-vite
        run: npm test
      - name: Lint
        working-directory: react-vite
        run: npm run lint
      - name: Production build
        working-directory: react-vite
        run: npm run build
      - name: Commit validated action feel gameplay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-vite/src/components/Game/engine.js
          git rm scripts/patch_action_feel.py .github/workflows/apply-action-feel.yml
          git diff --cached --check
          git commit -m "Polish combat feedback and contextual interaction"
          git push origin HEAD:feature/action-feel-polish
