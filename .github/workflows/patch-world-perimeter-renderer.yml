name: Patch world perimeter renderer

on:
  push:
    branches:
      - art/world-scale-perimeter-autotiles

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/world-scale-perimeter-autotiles
      - name: Wire topology art into engine
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('react-vite/src/components/Game/engine.js')
          source = path.read_text()
          source = source.replace(
              'import { showcaseTerrainAt } from "./showcaseTerrain";',
              'import { showcaseArtAt, showcaseTerrainAt } from "./showcaseTerrain";',
              1,
          )
          source = source.replace(
              '        const showcaseTile = showcaseTerrainAt(state.mapId, tx, ty);\n        const themedDungeonTiles = {',
              '        const showcaseTile = showcaseTerrainAt(state.mapId, tx, ty);\n        const showcaseArt = showcaseArtAt(state.mapId, tx, ty);\n        const themedDungeonTiles = {',
              1,
          )
          source = source.replace(
              ': (showcaseTile || indexedTile?.code || themedTile || tile);',
              ': (showcaseArt || showcaseTile || indexedTile?.code || themedTile || tile);',
              1,
          )
          if 'showcaseArtAt(state.mapId, tx, ty)' not in source:
              raise SystemExit('renderer patch did not apply')
          path.write_text(source)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-vite/src/components/Game/engine.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: render structural overworld perimeter art [perimeter-renderer-patched]"
          git push origin HEAD:art/world-scale-perimeter-autotiles
