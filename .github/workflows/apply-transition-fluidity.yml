name: Apply transition fluidity fix

on:
  push:
    branches:
      - fix/room-transitions-fluidity

permissions:
  contents: write

concurrency:
  group: apply-transition-fluidity
  cancel-in-progress: true

jobs:
  integrate-transition-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/room-transitions-fluidity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-vite/package-lock.json
      - name: Apply guarded engine patch
        run: python scripts/patch_transition_fluidity.py
      - name: Install frontend dependencies
        working-directory: react-vite
        run: npm ci
      - name: Run Jest
        working-directory: react-vite
        run: npm test
      - name: Lint
        working-directory: react-vite
        run: npm run lint
      - name: Production build
        working-directory: react-vite
        run: npm run build
      - name: Commit validated transition fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-vite/src/components/Game/engine.js
          git rm scripts/patch_transition_fluidity.py .github/workflows/apply-transition-fluidity.yml
          git diff --cached --check
          git commit -m "Fix room transition handoff and camera shimmer"
          git push origin HEAD:fix/room-transitions-fluidity
