name: Apply room runtime patch

on:
  push:
    branches:
      - feature/engine-logical-room-runtime

permissions:
  contents: write

jobs:
  patch-engine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/engine-logical-room-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-vite/package-lock.json
      - name: Apply guarded engine patch
        run: python scripts/patch_engine_room_runtime.py
      - name: Install frontend dependencies
        working-directory: react-vite
        run: npm ci
      - name: Run Jest
        working-directory: react-vite
        run: npm test
      - name: Lint
        working-directory: react-vite
        run: npm run lint
      - name: Production build
        working-directory: react-vite
        run: npm run build
      - name: Commit validated engine cutover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-vite/src/components/Game/engine.js
          git rm scripts/patch_engine_room_runtime.py .github/workflows/apply-room-runtime-patch.yml
          git diff --cached --check
          git commit -m "Wire logical rooms into the game engine"
          git push origin HEAD:feature/engine-logical-room-runtime
