name: Apply visible traversal showcase

on:
  push:
    branches:
      - feature/visible-traversal-showcase

permissions:
  contents: write

jobs:
  integrate-showcase:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/visible-traversal-showcase
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-vite/package-lock.json
      - name: Apply guarded world and engine patch
        run: python scripts/patch_visible_traversal.py
      - name: Install frontend dependencies
        working-directory: react-vite
        run: npm ci
      - name: Run Jest
        working-directory: react-vite
        run: npm test
      - name: Lint
        working-directory: react-vite
        run: npm run lint
      - name: Production build
        working-directory: react-vite
        run: npm run build
      - name: Commit validated visible traversal slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-vite/src/components/Game/world.js react-vite/src/components/Game/engine.js
          git rm scripts/patch_visible_traversal.py .github/workflows/apply-visible-traversal.yml
          git diff --cached --check
          git commit -m "Add visible ledges pits and traversal showcase"
          git push origin HEAD:feature/visible-traversal-showcase
