name: Apply world object v2 art

on:
  push:
    branches:
      - feature/v2-interaction-combat-visuals

permissions:
  contents: write

concurrency:
  group: apply-world-object-v2-art
  cancel-in-progress: true

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v2-interaction-combat-visuals
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: react-vite/package-lock.json
      - name: Apply guarded engine patch
        run: python scripts/patch_world_object_v2_art.py
      - name: Install frontend dependencies
        working-directory: react-vite
        run: npm ci --no-audit --no-fund
      - name: Run Jest
        working-directory: react-vite
        run: npm test -- --runInBand
      - name: Lint
        working-directory: react-vite
        run: npm run lint
      - name: Production build
        working-directory: react-vite
        run: npm run build
      - name: Remove one-shot integration files
        run: |
          rm scripts/patch_world_object_v2_art.py
          rm .github/workflows/apply-world-object-v2-art.yml
      - name: Commit validated engine integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-vite/src/components/Game/engine.js scripts/patch_world_object_v2_art.py .github/workflows/apply-world-object-v2-art.yml
          git diff --cached --quiet && exit 0
          git commit -m "Render interactive world objects with v2 art"
          git push origin HEAD:feature/v2-interaction-combat-visuals
