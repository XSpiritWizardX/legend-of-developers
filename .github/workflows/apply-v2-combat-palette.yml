name: Apply V2 combat palette

on:
  push:
    branches:
      - feature/v2-combat-palette

permissions:
  contents: write

concurrency:
  group: apply-v2-combat-palette
  cancel-in-progress: true

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v2-combat-palette
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: react-vite/package-lock.json
      - name: Apply guarded palette patch
        run: python scripts/patch_v2_combat_palette.py
      - name: Install frontend dependencies
        working-directory: react-vite
        run: npm ci --no-audit --no-fund
      - name: Run Jest
        working-directory: react-vite
        run: npm test -- --runInBand
      - name: Lint
        working-directory: react-vite
        run: npm run lint
      - name: Production build
        working-directory: react-vite
        run: npm run build
      - name: Remove one-shot integration files
        run: |
          rm scripts/patch_v2_combat_palette.py
          rm .github/workflows/apply-v2-combat-palette.yml
      - name: Commit validated palette cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-vite/src/components/Game/engine.js scripts/patch_v2_combat_palette.py .github/workflows/apply-v2-combat-palette.yml
          git diff --cached --quiet && exit 0
          git commit -m "Unify procedural effects with V2 palette"
          git push origin HEAD:feature/v2-combat-palette
