name: Apply attack transition fluidity

on:
  push:
    branches:
      - feature/attack-transition-fluidity

permissions:
  contents: write

concurrency:
  group: apply-attack-transition-fluidity
  cancel-in-progress: true

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/attack-transition-fluidity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: react-vite/package-lock.json
      - name: Apply guarded engine patch
        run: python scripts/patch_attack_transition_fluidity.py
      - name: Install frontend dependencies
        working-directory: react-vite
        run: npm ci --no-audit --no-fund
      - name: Run Jest
        working-directory: react-vite
        run: npm test -- --runInBand
      - name: Lint
        working-directory: react-vite
        run: npm run lint
      - name: Production build
        working-directory: react-vite
        run: npm run build
      - name: Remove one-shot integration files
        run: |
          rm scripts/patch_attack_transition_fluidity.py
          rm .github/workflows/apply-attack-transition-fluidity.yml
      - name: Commit validated fluidity integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-vite/src/components/Game/engine.js scripts/patch_attack_transition_fluidity.py .github/workflows/apply-attack-transition-fluidity.yml
          git diff --cached --quiet && exit 0
          git commit -m "Synchronize attack poses and room slides"
          git push origin HEAD:feature/attack-transition-fluidity
